services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment to reach Ollama from your host machine too (e.g. a host-installed `ollama` CLI):
    # ports:
    #   - "11434:11434"

  app:
    build: .
    depends_on:
      - ollama
    environment:
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: llama3.2:3b
      EMBED_BASE_URL: http://ollama:11434/v1
      EMBED_MODEL: nomic-embed-text
    volumes:
      - ./input_docs:/app/input_docs
      - ./output:/app/output
      - chroma_data:/app/chroma_db
    stdin_open: true
    tty: true

volumes:
  ollama_data:
  chroma_data:
